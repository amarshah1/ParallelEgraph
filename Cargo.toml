[package]
name = "parallel-egraph"
version = "0.1.0"
edition = "2021"

[dependencies]
yaspar = "2.7.0"
yaspar-ir = "2.7.2"
rayon = "1.10"
dashmap = "6"
tikv-jemallocator = "0.6"
voracious_radix_sort = { version = "1.2", features = ["voracious_multithread"] }
rustc-hash = "2"

[dev-dependencies]
rand = { version = "0.8", features = ["small_rng"] }

[profile.release]
debug = true

[[bench]]
name = "uf_ycsb"
harness = false

[[bench]]
name = "cr_scalability"
harness = false

[[bench]]
name = "rebuild_compare"
harness = false
